<!doctype html>
<html lang="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Display Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

  <div class="touchscreen">

    <!-- Hovedinnhold (Bytter mellom views) -->
    <main class="main-content">

      <!-- VIEW 1: Infoboard (Standard) -->
      <section id="view-dashboard" class="app-view active">
        <div class="dashboard-grid">

          <!-- RAD 1 -->
          <!-- RAD 1: Kombinert Vær & Sted (2x1) -->
          <div class="dashboard-module-card weather-card">
            <div class="weather-header">
              <h2 id="ts-location">Grorud</h2>
              <div id="ts-time" class="ts-time">--:--:--</div>
            </div>
            <div id="weather-blocks-container" class="weather-blocks"></div>
          </div>

          <!-- Modul 3: Spotify -->
          <div class="dashboard-module-card" id="spotify-widget">
            <div class="spotify-header">
              <span class="spotify-icon">🎵</span>
              <span class="spotify-title">Spiller nå</span>
            </div>
            <div class="spotify-content">
              <div class="spotify-main-info">
                <img id="spotify-album-art" src="" alt="Album Art" class="spotify-art hidden" />
                <div class="spotify-info">
                  <div id="spotify-track" class="spotify-track">Ingen musikk spilles</div>
                  <div id="spotify-artist" class="spotify-artist">--</div>
                  <div id="spotify-source" class="spotify-source"
                    style="font-size: 0.8em; opacity: 0.7; margin-top: 4px;"></div>
                </div>
              </div>
              <div class="spotify-controls">
                <button onclick="controlSpotify('previous')" class="spotify-btn">⏮</button>
                <button onclick="controlSpotify('playpause')" class="spotify-btn" id="spotify-play-btn">⏯</button>
                <button onclick="controlSpotify('next')" class="spotify-btn">⏭</button>
              </div>
            </div>
          </div>

          <!-- RAD 2 -->
          <!-- Modul 4: Buss (1x1) -->
          <!-- Modul for Stopp 1 (f.eks. Buss) -->
          <div class="dashboard-module-card">
            <div id="bus-routes-container" class="routes-list"></div>
          </div>

          <!-- Modul 5: T-bane (1x1) -->
          <!-- Modul for Stopp 2 (f.eks. T-bane) -->
          <div class="dashboard-module-card">
            <div id="tbane-routes-container" class="routes-list"></div>
          </div>

          <!-- Modul 6: Reisetid jobb -->
          <div class="dashboard-module-card" id="module-commute">
            <div class="module-title">🚗 Kjørevei til jobb</div>
            <div class="commute-details">
              <div class="primary-time">
                <span id="commute-duration">Laster...</span>
              </div>
              <div class="sub-info">
                <span id="commute-delay"></span>
                <span id="commute-distance"></span>
              </div>
            </div>
          </div>

          <!-- RAD 3 -->
          <!-- Modul 7: Placeholder -->
          <div class="dashboard-module-card" id="module-lighting">
            <div class="module-title"> Placeholder</div>
            <p>Statuslinje</p>
          </div>

          <!-- Modul 8: Kalender -->
          <div class="dashboard-module-card" id="module-calendar">
            <div class="module-title">Placeholder</div>
            <p>Statuslinje</p>
          </div>

          <!-- Modul 9: Varsler -->
          <div class="dashboard-module-card" id="module-notifications">
            <div class="module-title">Placeholder</div>
            <p>Statuslinje</p>
          </div>

        </div>
      </section>
    </main>

    <!-- Side-meny (Høyre side på Tab/PC, øverst på mobil) -->
    <nav class="side-menu">
      <div class="nav-buttons">
        <button class="nav-btn active" onclick="switchView('dashboard', this)" title="Infoboard">
          📊
        </button>

        <button class="nav-btn" onclick="switchView('remote', this)" title="Smart Remote">
          🏠
        </button>
      </div>

      <p class="status-bar" id="status">Kobler til...</p>
    </nav>

  </div> <!-- Slutt på .touchscreen -->

  <script src="/static/script.js"></script>
</body>

</html>
